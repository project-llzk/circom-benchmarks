name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lint Python
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.4"
          args: check --select E9,F --output-format=github
          src: >-
            scripts
            tests

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
